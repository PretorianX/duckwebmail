services:
  webmail-ui:
    image: ${WEBMAIL_IMAGE:?set WEBMAIL_IMAGE in .env}
    environment:
      PORT: "8002"
      TZ: ${TZ:-UTC}
      # Deployment defaults (user can override via localStorage later).
      # Allowed VITE_DEFAULT_THEME: light | dark | system
      # Allowed VITE_DEFAULT_SCHEME: duck | pure-email | paper | mono | duck2
      VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-system}
      VITE_DEFAULT_SCHEME: ${VITE_DEFAULT_SCHEME:-duck2}
      VITE_LOGIN_BRANDING: ${VITE_LOGIN_BRANDING:-DuckWebmail}
      VITE_LOGIN_TAGLINE: ${VITE_LOGIN_TAGLINE:-A lightweight webmail client for JMAP servers.}
    expose:
      - "8002"
    # Host nginx is already installed on the server. Bind UI to localhost only.
    ports:
      - "127.0.0.1:8002:8002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:8002/',res=>process.exit(res.statusCode>=200&&res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  stalwart-mail:
    # Use vendor image (same approach as dev compose).
    image: stalwartlabs/stalwart:latest
    environment:
      STALWART_PATH: /opt/stalwart
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER:?set STALWART_ADMIN_USER in .env}
      STALWART_ADMIN_SECRET: ${STALWART_ADMIN_SECRET:?set STALWART_ADMIN_SECRET in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "25:25"
      - "587:587"
      - "143:143"
      # Host nginx proxies JMAP to this. Bind to localhost only (host 8443 -> container 443).
      - "127.0.0.1:8443:443"
    volumes:
      # Persistent mail data.
      - ./stalwart-data:/opt/stalwart
      # Host-managed certbot TLS for Stalwart (mail.mailduck.systems).
      # These must exist on the server host.
      - /etc/letsencrypt/live/webmail.mail-duck.com/fullchain.pem:/opt/stalwart/certs/tls.crt:ro
      - /etc/letsencrypt/live/webmail.mail-duck.com/privkey.pem:/opt/stalwart/certs/tls.key:ro
      # Production config (no admin listener; only required ports).
      - ./stalwart/etc/config.prod.toml.template:/opt/stalwart/etc/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped