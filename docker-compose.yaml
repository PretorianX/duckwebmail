services:
  webmail-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      # Deployment defaults (user can override via localStorage later).
      # Allowed VITE_DEFAULT_THEME: light | dark | system
      # Allowed VITE_DEFAULT_SCHEME: duck | pure-email | paper | mono
      VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-light}
      VITE_DEFAULT_SCHEME: ${VITE_DEFAULT_SCHEME:-pure-email}
      VITE_LOGIN_BRANDING: ${VITE_LOGIN_BRANDING:-Pure Email}
    command: ["sh", "-lc", "npm ci && npm run dev -- --host 0.0.0.0 --port 8002"]
    volumes:
      - .:/app
      - /app/node_modules

  stalwart-certgen:
    image: alpine:latest
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache openssl
        mkdir -p /out/certs
        if [ ! -s /out/certs/tls.crt ] || [ ! -s /out/certs/tls.key ]; then
          echo "Generating self-signed TLS cert..."
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -batch -sha256 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout /out/certs/tls.key \
            -out /out/certs/tls.crt
        else
          echo "TLS cert already exists, skipping."
        fi
        ls -la /out/certs/
    volumes:
      - ./stalwart-data:/out
    restart: "no"

  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    depends_on:
      stalwart-certgen:
        condition: service_completed_successfully
    environment:
      # Used by stalwart/etc/config.toml
      STALWART_PATH: /opt/stalwart
      ADMIN_SECRET: admin
    ports:
      # SMTP (public)
      - "0.0.0.0:1025:25"
      # SMTP submission (public)
      - "0.0.0.0:10587:587"
      # IMAP / IMAPS
      - "10143:143"
      - "10193:993"
      # JMAP over HTTPS
      - "10443:443"
      # Admin UI + API (HTTP)
      - "8080:8080"
    volumes:
      # Persistent data (RocksDB, queue, certs, etc.)
      - ./stalwart-data:/opt/stalwart
      # Committed config for local/dev
      - ./stalwart/etc/config.toml:/opt/stalwart/etc/config.toml:ro
    restart: unless-stopped


