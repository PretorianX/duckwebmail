##
# Bootstrap nginx config (HTTP only) for initial cert generation.
#
# Use this FIRST on a fresh server (before certs exist), so nginx can start and
# certbot HTTP-01 challenges can succeed.
#
# After certs are issued for BOTH:
# - webmail.mail-duck.com
# - mail.mailduck.systems
#
# disable/remove this file and enable the full TLS config:
# - nginx/host/webmail.mail-duck.com.conf
##

server {
  listen 80;
  listen [::]:80;
  server_name webmail.mail-duck.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    default_type "text/plain";
    return 200 "Provisioning DuckWebmail (TLS cert pending).\n";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name mail.mailduck.systems;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    default_type "text/plain";
    return 200 "Provisioning Stalwart (TLS cert pending).\n";
  }
}


