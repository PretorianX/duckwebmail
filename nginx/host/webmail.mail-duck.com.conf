##
# DuckWebmail host nginx vhost for: webmail.mail-duck.com
#
# Copy to (example):
# - /etc/nginx/sites-available/webmail.mail-duck.com.conf
# - ln -s /etc/nginx/sites-available/webmail.mail-duck.com.conf /etc/nginx/sites-enabled/
#
# IMPORTANT:
# This config references certbot-managed cert files. nginx will NOT start if they
# do not exist yet. For initial provisioning, use:
# - nginx/host/00-bootstrap-acme-webmail-and-mail.conf
# to obtain certs first, then enable this full TLS config.
#
# Assumptions:
# - certbot is already installed and manages:
#   - /etc/letsencrypt/live/webmail.mail-duck.com/fullchain.pem
#   - /etc/letsencrypt/live/webmail.mail-duck.com/privkey.pem
# - DuckWebmail UI container publishes localhost-only:
#   - 127.0.0.1:8002 -> container :8002
# - Stalwart publishes localhost-only for JMAP/HTTPS:
#   - 127.0.0.1:8443 -> container :443
# - HTTP-01 challenges use webroot: /var/www/certbot
#   (create dir + ensure certbot uses --webroot -w /var/www/certbot)
##

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name webmail.mail-duck.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name mail.mailduck.systems;

  # HTTP-01 challenge for Stalwart's cert (mail.mailduck.systems)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name webmail.mail-duck.com;

  ssl_certificate /etc/letsencrypt/live/webmail.mail-duck.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/webmail.mail-duck.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https: wss:;" always;

  client_max_body_size 50m;

  # JMAP discovery (some clients may hit it).
  location ^~ /.well-known/jmap {
    proxy_pass https://127.0.0.1:8443;
    proxy_http_version 1.1;

    # Forward Authorization from the browser for normal HTTP requests.
    proxy_set_header Authorization $http_authorization;
    # Avoid browser-native Basic Auth prompts.
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Localhost upstream; keep it simple/robust across distros.
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # JMAP WebSocket endpoint: browsers can't set Authorization, so the app sends `?auth=Basic ...`.
  location ^~ /jmap/ws {
    proxy_pass https://127.0.0.1:8443;
    proxy_http_version 1.1;

    proxy_set_header Authorization $arg_auth;
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # JMAP API + WebSocket push
  location ^~ /jmap/ {
    proxy_pass https://127.0.0.1:8443;
    proxy_http_version 1.1;

    proxy_set_header Authorization $http_authorization;
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # DuckWebmail UI (SPA)
  location / {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

server {
  listen 443 ssl http2;
  server_name mail.mailduck.systems;

  ssl_certificate /etc/letsencrypt/live/webmail.mail-duck.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/webmail.mail-duck.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

